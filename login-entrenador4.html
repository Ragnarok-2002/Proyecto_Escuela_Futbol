<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Login Completo</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { margin-top: 0; color: #333; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #666; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #0056b3; }
        .error { color: red; font-size: 14px; margin-top: 10px; display: none; }
        .hidden { display: none; }
        .success-box { border-left: 5px solid #28a745; background: #e8f5e9; padding: 15px; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- SECCIÓN DE LOGIN -->
    <div id="login-section" class="card">
        <h2>Iniciar Sesión</h2>
        <form id="login-form">
            <div class="input-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" required placeholder="admin">
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="password123">
            </div>
            <button type="submit">Entrar</button>
            <div id="error-msg" class="error"></div>
        </form>
    </div>

    <!-- SECCIÓN DEL DASHBOARD (OCULTA POR DEFECTO) -->
    <div id="dashboard-section" class="card hidden">
        <h2>Panel de Control</h2>
        <div class="success-box">
            <p id="dashboard-data">Cargando datos protegidos...</p>
        </div>
        <br>
        <button id="logout-btn" style="background: #dc3545;">Cerrar Sesión</button>
    </div>

    <script>
        const loginForm = document.getElementById('login-form');
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const errorMsg = document.getElementById('error-msg');
        const dashboardData = document.getElementById('dashboard-data');
        const logoutBtn = document.getElementById('logout-btn');

        // 1. Manejar el envío del Login
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Guardar el token JWT en localStorage
                    localStorage.setItem('token', data.token);
                    // Cargar la vista protegida
                    showDashboard();
                } else {
                    showError(data.message);
                }
            } catch (err) {
                showError('Error al conectar con el servidor.');
            }
        });

        // 2. Consultar la Ruta Protegida usando el Token
        async function showDashboard() {
            const token = localStorage.getItem('token');
            if (!token) return;

            try {
                const response = await fetch('/api/dashboard', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();

                if (response.ok) {
                    loginSection.classList.add('hidden');
                    dashboardSection.classList.remove('hidden');
                    dashboardData.innerText = data.message;
                } else {
                    // Si el token expiró o es falso
                    logout();
                }
            } catch (err) {
                showError('Error al validar sesión.');
            }
        }

        // 3. Manejar Cierre de Sesión
        function logout() {
            localStorage.removeItem('token');
            loginSection.classList.remove('hidden');
            dashboardSection.classList.add('hidden');
            loginForm.reset();
        }

        logoutBtn.addEventListener('click', logout);

        // Helper para mostrar errores
        function showError(msg) {
            errorMsg.innerText = msg;
            errorMsg.style.display = 'block';
        }

        // Al cargar la página, comprobar si ya tiene sesión iniciada
        if (localStorage.getItem('token')) {
            showDashboard();
        }
    </script>
</body>
</html>
